<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVENE MESSENGER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap');
        * { font-family: 'Noto Sans Thai', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
        :root { --p: #9d65c9; --d: #7e22ce; --l: #faf7ff; }
        body { background: var(--l); min-height: 100vh; }
        .badge { background: linear-gradient(135deg, #7e22ce, #a855f7); }
        .chat-item:hover { background: rgba(147, 51, 234, 0.05); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; visibility: hidden; transition: .3s; }
        .overlay.show { opacity: 1; visibility: visible; }
        .room { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(180deg, #e9d5ff, #faf7ff); border-radius: 24px 24px 0 0; z-index: 100; transform: translateY(100%); transition: .4s; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
        .room.show { transform: translateY(0); }
        .close-btn { position: absolute; top: 1rem; right: 1rem; width: 36px; height: 36px; border-radius: 50%; background: white; border: none; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #7e22ce; z-index: 20; }

        /* ✅ พื้นหลังอยู่กับที่ + ตัวน้องขยับเบาๆ */
        .scene {
            position: relative;
            width: 280px;
            height: 350px;
            margin: 0 auto;
        }
        .bg-room {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1rem;
        }
        .char-nong {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 65%;
            height: auto;
            z-index: 10;
            animation: gentleFloat 3.5s ease-in-out infinite;
        }
        @keyframes gentleFloat {
            0%   { transform: translateX(-50%) translateY(0px); }
            25%  { transform: translateX(-50%) translateY(-5px); }
            50%  { transform: translateX(-50%) translateY(-2px); }
            75%  { transform: translateX(-50%) translateY(-5px); }
            100% { transform: translateX(-50%) translateY(0px); }
        }
    </style>
</head>
<body>

<div id="page1">
<div class="bg-white pt-10 pb-5 px-5 shadow-sm">
    <p class="text-purple-400 text-sm">VIVENE MESSENGER</p>
    <div class="flex items-center justify-between mt-1 mb-4">
        <h1 class="text-3xl font-bold text-purple-800">Chats</h1>
        <div class="flex gap-2">
            <button class="w-9 h-9 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center"><i class="fa fa-search"></i></button>
            <button class="w-9 h-9 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center"><i class="fa fa-user-plus"></i></button>
        </div>
    </div>
    <div class="relative">
        <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-purple-400"></i>
        <input type="text" placeholder="ค้นหาแชท..." class="w-full py-2.5 pl-9 pr-4 rounded-full bg-purple-50 border-0 outline-none">
    </div>
</div>

<div class="px-5 py-3 pb-24">
    <p class="text-purple-500 text-sm font-semibold mb-3">ปักหมุด</p>
    <div class="flex gap-5 mb-6">
        <div class="flex flex-col items-center cursor-pointer" onclick="openRoom('vivene')">
            <div class="relative">
                <img src="https://i.postimg.cc/6yMmM7Wg/image.png" class="w-16 h-16 rounded-full border-2 border-purple-300 object-cover">
                <span class="badge absolute -top-1 -right-1 w-5 h-5 text-white text-xs rounded-full flex items-center justify-center">2</span>
            </div>
            <span class="text-xs mt-1">น้อง</span>
        </div>
        <div class="flex flex-col items-center cursor-pointer" onclick="openRoom('sarah')">
            <div class="relative">
                <img src="https://picsum.photos/id/1027/100/100" class="w-16 h-16 rounded-full border-2 border-purple-300">
                <span class="badge absolute -top-1 -right-1 w-5 h-5 text-white text-xs rounded-full flex items-center justify-center">1</span>
            </div>
            <span class="text-xs mt-1">Sarah</span>
        </div>
    </div>

    <p class="text-purple-500 text-sm font-semibold mb-3">การสนทนา</p>

    <div class="chat-item flex items-center justify-between p-3 rounded-xl mb-2 cursor-pointer" onclick="openRoom('vivene')">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="https://i.postimg.cc/6yMmM7Wg/image.png" class="w-12 h-12 rounded-full object-cover">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></span>
            </div>
            <div>
                <h4 class="font-semibold">น้อง Vivene</h4>
                <p class="text-sm text-gray-500">ยินดีต้อนรับสู่ปราสาทของฉัน! ✨</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-xs text-gray-400">เพิ่งผ่านมา</p>
            <span class="badge inline-block w-5 h-5 text-white text-xs rounded-full text-center mt-1">2</span>
        </div>
    </div>

    <div class="chat-item flex items-center justify-between p-3 rounded-xl mb-2 cursor-pointer" onclick="openRoom('sarah')">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="https://picsum.photos/id/1027/100/100" class="w-12 h-12 rounded-full">
                <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></span>
            </div>
            <div>
                <h4 class="font-semibold">Sarah Connor</h4>
                <p class="text-sm text-gray-500">ไว้คุยกันนะ!</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-xs text-gray-400">10:42</p>
            <span class="badge inline-block w-5 h-5 text-white text-xs rounded-full text-center mt-1">1</span>
        </div>
    </div>
</div>
</div>

<div id="overlay" class="overlay" onclick="closeRoom()"></div>

<div id="room" class="room">
    <button class="close-btn" onclick="closeRoom()">×</button>
    <div id="roomContent" class="text-center"></div>
</div>

<script>
const data = {
    vivene: {
        title: "ห้องนั่งเล่นของน้อง Vivene 💜",
        greet: "ยินดีต้อนรับสู่ห้องของฉัน มานั่งพักผ่อนกันนะคะ ✨",
        bg: "https://i.postimg.cc/NL3h120H/image.png",
        char: "https://i.postimg.cc/6yMmM7Wg/image.png"
    },
    sarah: {
        title: "ห้องของ Sarah ☕",
        greet: "สบายๆ เลยนะคะ มีชาและขนมมาเสิร์ฟให้แล้ว",
        img: "https://picsum.photos/id/1027/300/400"
    }
};

function openRoom(id) {
    const overlay = document.getElementById('overlay');
    const room = document.getElementById('room');
    const content = document.getElementById('roomContent');
    const d = data[id];

    if (id === 'vivene') {
        content.innerHTML = `
            <h2 class="text-xl font-bold text-purple-800 mb-4">${d.title}</h2>
            <div class="scene my-6">
                <img src="${d.bg}" alt="พื้นหลังห้อง" class="bg-room">
                <img src="${d.char}" alt="ตัวน้อง" class="char-nong">
            </div>
            <div class="bg-white/60 rounded-2xl p-4">
                <p class="text-gray-700">${d.greet}</p>
            </div>
        `;
    } else {
        content.innerHTML = `
            <h2 class="text-xl font-bold text-purple-800 mb-4">${d.title}</h2>
            <div class="my-6">
                <img src="${d.img}" alt="ตัวละคร" class="max-w-xs mx-auto rounded-2xl shadow-lg">
            </div>
            <div class="bg-white/60 rounded-2xl p-4">
                <p class="text-gray-700">${d.greet}</p>
            </div>
        `;
    }

    overlay.classList.add('show');
    room.classList.add('show');
}

function closeRoom() {
    document.getElementById('overlay').classList.remove('show');
    document.getElementById('room').classList.remove('show');
}
</script>

</body>
</html>
